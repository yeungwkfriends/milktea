<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container {
            height: calc(100vh - 180px);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .user-bubble {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-msg {
            animation: slideIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased">

    <div class="max-w-3xl mx-auto h-screen flex flex-col p-4 md:p-6">
        <!-- Brand Header -->
        <header class="flex items-center gap-4 mb-6 shrink-0">
            <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-indigo-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-slate-800">StudyConnect AI</h1>
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Secure Class Portal</span>
                </div>
            </div>
        </header>

        <!-- Main Chat Area -->
        <div id="chat-window" class="chat-container glass-panel rounded-3xl overflow-y-auto p-4 md:p-6 flex flex-col gap-4 shadow-sm">
            <div class="animate-msg bg-white border border-slate-200 text-slate-700 p-4 rounded-2xl rounded-tl-none text-sm max-w-[85%] self-start shadow-sm">
                Hello! I'm your AI study assistant. Ask me anything about your coursework, and I'll help you work through it.
            </div>
        </div>

        <!-- Input Section -->
        <div class="mt-4 shrink-0">
            <div class="relative group">
                <input type="text" id="user-input" 
                    placeholder="Type your question here..." 
                    class="w-full bg-white px-6 py-5 pr-16 rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 transition-all font-medium text-slate-700 disabled:opacity-50">
                
                <button onclick="handleSend()" id="send-btn" 
                    class="absolute right-2 top-2 bottom-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 rounded-xl transition-all active:scale-95 flex items-center justify-center disabled:grayscale disabled:opacity-50">
                    <svg id="send-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    <svg id="loading-icon" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>
            <p class="text-[10px] text-center text-slate-400 mt-4 font-semibold uppercase tracking-tighter">Your API Key is handled securely on the server</p>
        </div>
    </div>

    <script>
        /**
         * IMPORTANT: Replace this URL with your actual deployed backend URL
         * Example: "https://your-app-name.vercel.app/api/chat"
         */
        const BACKEND_ENDPOINT = "https://milkteaback.com/api/chat";

        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sendIcon = document.getElementById('send-icon');
        const loadingIcon = document.getElementById('loading-icon');

        function setSubmitting(isSubmitting) {
            userInput.disabled = isSubmitting;
            sendBtn.disabled = isSubmitting;
            if (isSubmitting) {
                sendIcon.classList.add('hidden');
                loadingIcon.classList.remove('hidden');
            } else {
                sendIcon.classList.remove('hidden');
                loadingIcon.classList.add('hidden');
                userInput.focus();
            }
        }

        function appendMessage(role, content) {
            const wrapper = document.createElement('div');
            const isUser = role === 'user';
            
            wrapper.className = isUser ? 'self-end max-w-[85%]' : 'self-start max-w-[85%]';
            
            const bubble = document.createElement('div');
            bubble.className = isUser 
                ? 'animate-msg user-bubble text-white p-4 rounded-2xl rounded-tr-none shadow-md text-sm font-medium'
                : 'animate-msg bg-white border border-slate-200 text-slate-800 p-4 rounded-2xl rounded-tl-none shadow-sm text-sm leading-relaxed';
            
            bubble.innerText = content;
            wrapper.appendChild(bubble);
            chatWindow.appendChild(wrapper);
            
            // Auto scroll to bottom
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
        }

        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            appendMessage('user', message);
            userInput.value = '';
            setSubmitting(true);

            try {
                const response = await fetch(BACKEND_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) throw new Error('Backend error');

                const data = await response.json();
                appendMessage('bot', data.text);
            } catch (error) {
                console.error(error);
                appendMessage('bot', "I'm having trouble reaching the school server. Please try again later or tell your teacher.");
            } finally {
                setSubmitting(false);
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });
    </script>
</body>
</html>
