<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white shadow-xl rounded-2xl flex flex-col h-[600px]">
        <div class="p-4 bg-blue-600 text-white rounded-t-2xl font-bold">
            Grok 3 Mini AI助手 (Cantonese)
        </div>

        <div id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-gray-100 p-3 rounded-lg self-start max-w-[80%] text-sm">
                你好！我係你嘅AI助手。請問有咩可以幫到你？
            </div>
        </div>

        <div class="p-4 border-t flex gap-2">
            <input type="text" id="user-input" placeholder="問下我嘢..." class="flex-1 border p-2 rounded-lg outline-none focus:border-blue-500">
            <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">發送</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://milkteaback.vercel.app/api/chat";

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatWindow = document.getElementById('chat-window');
            const text = input.value.trim();
            if (!text) return;

            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = "bg-blue-500 text-white p-3 rounded-lg self-end ml-auto max-w-[80%] text-sm text-right";
            userDiv.innerText = text;
            chatWindow.appendChild(userDiv);
            input.value = "";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                // Add AI response
                const botDiv = document.createElement('div');
                botDiv.className = "bg-gray-100 p-3 rounded-lg self-start max-w-[80%] text-sm";
                botDiv.innerText = data.text || "Error";
                chatWindow.appendChild(botDiv);
            } catch (e) {
                console.error(e);
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
